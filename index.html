<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Милана в отрыве: браузерная игра про 30 дней тура по городам России.">
<meta name="theme-color" content="#14171c">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Милана в отрыве</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  /* Layout: phone-first column (road sign, gauges, action pad); on wide screens the story feed moves to a right column */
  --asphalt:#14171c; --panel:#1d222a; --panel-2:#272e38; --line:#363e4a;
  --paper:#ece6d6; --muted:#9aa3ae;
  --sign:#1c4ea0; --sign-ink:#ffffff;
  --route:#2b8b53; --mark:#f2c230; --siren:#d9403f; --ink-on-mark:#1a1708;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--asphalt);color:var(--paper)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
.app{max-width:1060px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.left{display:grid;gap:16px;min-width:0}
.right{display:grid;gap:12px;min-width:0;align-content:start}
@media (min-width:880px){
  .app{grid-template-columns:minmax(0,430px) minmax(0,1fr);align-items:start}
  .right{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
}

/* road sign */
.sign{background:var(--sign);border-radius:10px;padding:6px;box-shadow:0 14px 34px -16px rgba(0,0,0,.7)}
.sign-inner{border:3px solid var(--sign-ink);border-radius:6px;padding:12px 16px 16px;display:grid;gap:8px;color:var(--sign-ink)}
.sign-top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sign h1{font-family:var(--f-display);font-weight:700;font-size:clamp(23px,6.4vw,32px);line-height:1.08;margin:0;text-wrap:balance}
.sign-sub{font-size:14px;opacity:.88}
.route{display:inline-block;background:var(--siren);color:var(--sign-ink);font-family:var(--f-display);font-weight:500;font-size:11px;letter-spacing:.04em;padding:3px 7px;border-radius:3px;border:1.5px solid var(--sign-ink)}
.dash{height:4px;background:repeating-linear-gradient(90deg,var(--mark) 0 26px,transparent 26px 44px);opacity:.85;border-radius:2px}

.hero{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.who{font-size:15px}.who b{font-family:var(--f-display);font-weight:700;font-size:17px}
.mood{color:var(--mark)}
.money{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}

/* gauges */
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.g{display:grid;gap:5px;min-width:0}
.g-l{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.g-l b{font-family:var(--f-mono);font-weight:500;color:var(--paper);letter-spacing:0;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .45s ease}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.segs i{height:8px;background:var(--panel-2);border-radius:1px}
.segs i.on{background:var(--mark)}
.segs i.hot{background:var(--siren)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.num{background:var(--panel);border-radius:8px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.num span{font-size:11.5px;letter-spacing:.01em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}

/* actions */
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act,.choice{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:11px 10px;text-align:left;display:grid;gap:4px;align-content:start;cursor:pointer;min-height:64px;transition:background .15s,border-color .15s,transform .1s}
.act:hover:not(:disabled),.choice:hover:not(:disabled){border-color:var(--mark);background:var(--panel-2)}
.act:active:not(:disabled),.choice:active:not(:disabled){transform:translateY(1px)}
.act:focus-visible,.choice:focus-visible,.ghost:focus-visible,.stop:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.act:disabled,.choice:disabled{opacity:.38;cursor:not-allowed}
.act-t{font-family:var(--f-display);font-size:12.5px;font-weight:500;line-height:1.2}
.act-m{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:1.3}
.act.sleep{background:var(--mark);border-color:var(--mark);color:var(--ink-on-mark)}
.act.sleep .act-m{color:var(--ink-on-mark);opacity:.75}
.act.sleep:hover:not(:disabled){background:var(--mark);filter:brightness(1.06)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--paper);border-color:var(--muted)}

/* feed */
.feed-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.feed-head h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.feed-head span{font-size:12px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ev{background:var(--panel);border-radius:8px;padding:11px 14px 12px;display:grid;gap:6px}
.ev-top{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tag{padding:1px 6px;border-radius:3px;background:var(--panel-2);color:var(--paper);text-transform:lowercase}
.tag.good{background:rgba(43,139,83,.28);color:#9fe0b6}
.tag.bad{background:rgba(217,64,63,.25);color:#f3a9a8}
.tag.big{background:var(--mark);color:var(--ink-on-mark)}
.ev p{margin:0;max-width:62ch}
.ev.fresh{animation:pop .4s ease}
@keyframes pop{from{transform:translateY(-4px);opacity:.4}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.up{color:#9fe0b6;border-color:rgba(43,139,83,.6)}
.chip.dn{color:#f3a9a8;border-color:rgba(217,64,63,.55)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(7,9,12,.74);display:grid;grid-template-rows:minmax(0,1fr);place-items:end center;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{place-items:center}}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
.sheet p{margin:0}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mark)}
.choices{display:grid;gap:8px}
.choice{min-height:0}
.choice .act-t{font-size:13.5px}
.muted{color:var(--muted)}

/* karaoke */
.lyric{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.35;min-height:2.8em}
.track{position:relative;height:48px;background:var(--panel-2);border-radius:6px;overflow:hidden;cursor:pointer;touch-action:manipulation}
.zone{position:absolute;top:0;bottom:0;background:rgba(43,139,83,.38);border-left:2px solid var(--route);border-right:2px solid var(--route)}
.zone b{position:absolute;top:0;bottom:0;left:35%;right:35%;background:rgba(43,139,83,.5)}
.needle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--mark);box-shadow:0 0 12px rgba(242,194,48,.7)}
.notes{display:flex;gap:6px}
.notes i{flex:1;height:6px;border-radius:2px;background:var(--panel-2)}
.notes i.n2{background:var(--route)}.notes i.n1{background:var(--mark)}.notes i.n0{background:var(--siren)}
.verdict{font-family:var(--f-mono);font-size:13px;min-height:1.4em;color:var(--mark)}
.big-btn{appearance:none;border:0;border-radius:8px;background:var(--mark);color:var(--ink-on-mark);font-family:var(--f-display);font-weight:700;font-size:15px;padding:14px;cursor:pointer;touch-action:manipulation}
.big-btn:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.big-btn:disabled{opacity:.4;cursor:default}

/* fight */
.fighters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ftr{display:grid;gap:5px;min-width:0}
.ftr b{font-family:var(--f-display);font-weight:500;font-size:13px;line-height:1.25}
.tell{font-family:var(--f-mono);font-size:13px;background:var(--panel-2);padding:10px 12px;border-radius:6px}
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.moves .choice{min-height:58px}
.flog{font-size:13.5px;color:var(--muted);min-height:2.8em}

/* travel */
.strip{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding-top:6px}
.strip::before{content:"";position:absolute;left:6%;right:6%;top:14px;height:4px;background:repeating-linear-gradient(90deg,var(--mark) 0 9px,transparent 9px 15px);opacity:.7}
.stop{position:relative;display:grid;justify-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0 0 4px;border-radius:6px;min-width:0}
.stop .dot{width:18px;height:18px;border-radius:50%;background:var(--asphalt);border:3px solid var(--muted);position:relative;z-index:1}
.stop.been .dot{border-color:var(--route)}
.stop.here .dot{background:var(--mark);border-color:var(--mark)}
.stop.sel .dot{box-shadow:0 0 0 4px rgba(242,194,48,.35);border-color:var(--mark)}
.stop span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.stop.sel span,.stop.here span{color:var(--paper)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--muted)}
.legend i.l-here{background:var(--mark);border-color:var(--mark)}.legend i.l-been{border-color:var(--route)}

/* ending ticket */
.ticket{border:2px dashed var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.ticket .rank{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--mark);line-height:1.15;text-wrap:balance}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}


/* stage */
.stage{position:relative;height:190px;border-radius:10px;overflow:hidden;background:var(--panel)}
.stage canvas,.mini-stage{display:block;width:100%;height:100%}
.mini-stage{height:150px;border-radius:8px;background:var(--panel-2)}
.stage-cap{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:11.5px;background:rgba(10,12,16,.72);color:var(--paper);padding:4px 8px;border-radius:4px;max-width:calc(100% - 20px)}
.actions.busy .act{opacity:.55}
.fbody{display:grid;gap:12px}

/* quest, achievements, sound toggles */
.foot{flex-wrap:wrap}
.foot-btns{display:flex;gap:6px;flex-wrap:wrap}
.quest{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px dashed var(--mark);border-radius:8px;padding:8px 12px;font-size:13.5px;min-width:0}
.quest .q-k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mark);white-space:nowrap}
.quest .q-t{flex:1;min-width:0}
.quest b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.quest.done{border-style:solid;border-color:var(--route)}
.quest.done .q-k,.quest.done b{color:#9fe0b6}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach{background:var(--panel-2);border-radius:8px;padding:8px 10px;display:grid;gap:2px;font-size:12.5px;color:var(--muted)}
.ach b{font-family:var(--f-display);font-weight:500;font-size:12.5px;color:var(--paper)}
.ach:not(.got){opacity:.55}
.ach.got{outline:1px solid rgba(242,194,48,.55)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--mark);color:var(--ink-on-mark);font-family:var(--f-display);font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:8px;box-shadow:0 10px 30px -10px rgba(0,0,0,.8);max-width:calc(100% - 32px);text-align:center;animation:up .25s ease}
@media (min-width:880px){.stage{height:210px}}
@media (max-width:380px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.act-t{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <section class="left">
    <header class="sign" aria-live="polite">
      <div class="sign-inner">
        <div class="sign-top"><span id="dayLbl">День 1 из 30</span><span class="route" id="routeLbl">М-4</span></div>
        <h1 id="cityName">Москва</h1>
        <div class="sign-sub" id="citySub"></div>
      </div>
    </header>
    <div class="stage"><canvas id="stageCv" role="img" aria-label="Сцена: что сейчас делает Милана"></canvas><div class="stage-cap" id="stageCap" hidden></div></div>
    <div class="hero">
      <div class="who"><b>Милана</b>, 20 · <span class="mood" id="moodLbl">в норме</span> · <span id="clockLbl">10:00</span></div>
      <div class="money" id="moneyLbl">5 000 ₽</div>
    </div>
    <div class="gauges" id="gauges"></div>
    <div class="nums" id="nums"></div>
    <div class="quest" id="quest"></div>
    <div class="dash" aria-hidden="true"></div>
    <div class="actions" id="actions"></div>
    <div class="foot"><span id="tripLbl">Города: 1 из 8</span><div class="foot-btns"><button class="ghost" id="sndBtn" type="button">Звук: вкл</button><button class="ghost" id="voiceBtn" type="button">Голос: вкл</button><button class="ghost" id="achBtn" type="button">Ачивки</button><button class="ghost" id="newGame" type="button">Новый тур</button></div></div>
  </section>
  <section class="right">
    <div class="feed-head"><h2>Лента</h2><span>свежее сверху</span></div>
    <ol class="feed" id="feed"></ol>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
// ---------- data ----------
const CITIES={
  kgd:{name:'Калининград',short:'Клд',route:'А-229',lat:54.71,lon:20.51,sub:'Балтика, янтарь и ветер с моря',bar:900,hostel:900,pay:1.0,fight:.8},
  spb:{name:'Санкт-Петербург',short:'СПб',route:'М-11',lat:59.94,lon:30.31,sub:'Рубинштейна, разводные мосты и дождь',bar:1000,hostel:1000,pay:1.2,fight:.9},
  msk:{name:'Москва',short:'Мск',route:'М-4',lat:55.75,lon:37.62,sub:'Патрики, крыши и цены как в космосе',bar:1600,hostel:1500,pay:1.6,fight:1},
  sochi:{name:'Сочи',short:'Сочи',route:'А-147',lat:43.6,lon:39.72,sub:'Море, пальмы и курортные тарифы',bar:1300,hostel:1400,pay:1.2,fight:.8},
  kzn:{name:'Казань',short:'Кзн',route:'М-7',lat:55.79,lon:49.12,sub:'Баумана, чак-чак и кальянные',bar:800,hostel:800,pay:1.0,fight:1},
  ekb:{name:'Екатеринбург',short:'Екб',route:'Р-242',lat:56.84,lon:60.6,sub:'Плотинка, рок и суровые люди',bar:850,hostel:850,pay:1.05,fight:1.4},
  nsk:{name:'Новосибирск',short:'Нск',route:'Р-254',lat:55.03,lon:82.92,sub:'Мороз, Академгородок и размах',bar:750,hostel:750,pay:1.0,fight:1.2},
  vdk:{name:'Владивосток',short:'Влад',route:'А-370',lat:43.12,lon:131.89,sub:'Сопки, крабы и Тихий океан',bar:1100,hostel:1000,pay:1.15,fight:1.1},
};
const ORDER=['kgd','spb','msk','sochi','kzn','ekb','nsk','vdk'];

const ENEMIES=[
  {n:'Гопник у ларька',hp:30,d:8,ai:[.5,.25,.25]},
  {n:'Ревнивая девушка с маникюром',hp:24,d:7,ai:[.6,.15,.25]},
  {n:'Вышибала Гена',hp:46,d:11,ai:[.45,.4,.15]},
  {n:'Футбольный фанат в шарфе',hp:36,d:9,ai:[.55,.2,.25]},
  {n:'Байкер в кожаной жилетке',hp:40,d:10,ai:[.5,.3,.2]},
  {n:'Таксист, который «знает короткую дорогу»',hp:28,d:7,ai:[.4,.3,.3]},
  {n:'Качок из фитнес-клуба',hp:42,d:10,ai:[.6,.3,.1]},
];
const TELLS={
  atk:['замахивается с плеча','сжимает кулаки и прёт вперёд','орёт «ну всё, держись»'],
  blk:['поднял руки к лицу','встал боком и закрылся','пятится и прикрывается'],
  dge:['пританцовывает на месте','пригнулся и смотрит исподлобья','качает корпусом туда-сюда'],
};

const SONGS=[
  {t:'Трасса М-11',l:['Фары режут ночь пополам','я не сплю, я лечу по своим делам','мама, я в Питере, всё хорошо','просто сердце громче, чем шоссе','трасса, держи меня, не отпускай']},
  {t:'Верхняя боковая',l:['Верхняя боковая, чай в подстаканнике','проводница смотрит, как на хулиганку','за окном Россия, бесконечный трек','я пою вагону, вагон поёт в ответ','на конечной выйду другой']},
  {t:'Не звони в пять утра',l:['Не звони мне в пять утра','я ещё не дома, мам, пока','у меня тут целый город','и сто новых лиц вокруг','утром всё расскажу, честно']},
  {t:'Королева района',l:['Кроссы белые, взгляд прямой','каждый двор считает меня своей','если громко, значит я','если весело, значит мы','королева района, привет']},
];

const GIGS=[
  {t:'Официантка в кафе',p:2600,note:'Ноги гудят, чаевые норм.'},
  {t:'Промоутер у клуба',p:2100,fx:{content:1,fun:4},note:'Зазывала народ и сама чуть не зашла.'},

const HAS_TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function actx(){if(!SND.ac){try{SND.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(SND.ac.state==='suspended')SND.ac.resume();return SND.ac}
function tone(f,d,o={}){const a=actx();if(!a)return;const t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();
  os.type=o.type||'square';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.08,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g).connect(a.destination);os.start(t);os.stop(t+d+.03)}
function noise(d,o={}){const a=actx();if(!a)return;const t=a.currentTime+(o.at||0),n=Math.max(1,Math.floor(a.sampleRate*d)),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;fl.type=o.type||'lowpass';fl.frequency.value=o.f||1200;g.gain.value=o.vol||.2;
  s.connect(fl).connect(g).connect(a.destination);s.start(t)}

  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt.replace(/«|»/g,''));u.lang='ru-RU';

  openSheet(`<div class="kicker">Ачивки · ${n} из ${ACH.length}</div><h3>Достижения тура</h3><div class="achs">${ACH.map(a=>`<div class="ach${S.ach[a.id]?' got':''}"><b>${S.ach[a.id]?'🏆':'🔒'} ${a.t}</b><span>${a.d}</span></div>`).join('')}</div><button type="button" class="big-btn" id="achClose">Закрыть</button>`);
  $('achClose').onclick=closeSheet}

function dist(a,b){const A=CITIES[a],B=CITIES[b],R=6371,r=x=>x*Math.PI/180;
  const h=Math.sin(r(B.lat-A.lat)/2)**2+Math.cos(r(A.lat))*Math.cos(r(B.lat))*Math.sin(r(B.lon-A.lon)/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h))*1.25/10)*10}

const FX_LBL={money:'₽',hp:'здоровья',energy:'сил',fun:'кайфа',booze:'градус',fame:'подп.',content:'контент',vocal:'вокал',punch:'удар'};
function fx(e){const chips=[];
  for(const k in e){const v=e[k];if(!v)continue;const before=S[k];
    if(k==='money'||k==='fame')S[k]=Math.max(0,S[k]+v);
    else if(k==='booze')S.booze=clamp(S.booze+v,0,6);
    else if(k==='content')S.content=clamp(S.content+v,0,10);
    else if(k==='vocal'||k==='punch')S[k]=Math.min(10,+(S[k]+v).toFixed(1));
    else S[k]=clamp(S[k]+v);
    const d=S[k]-before;if(!d)continue;
    const sign=d>0?'+':'−',abs=Math.abs(d);
    const t=k==='money'?`${sign}${fmt(abs)} ₽`:`${sign}${(k==='vocal'||k==='punch')?abs.toFixed(1):fmt(abs)} ${FX_LBL[k]}`;
    chips.push({t,c:k==='booze'?'':(d>0?'up':'dn')});
  }
  return chips}

function say(text,tag,kind,chips){
  S.feed.unshift({id:++S.seq,d:Math.min(S.day,MAX_DAY),h:S.hour,c:S.city,text,tag,kind:kind||'',chips:chips||[]});
  if(S.feed.length>80)S.feed.length=80}

const H={
  walk(){qp('walk');const pool=WALK.filter(e=>(!e.city||e.city===S.city)&&(!e.when||e.when()));

      return{t:g.t,m:locked?`нужен ${g.need==='vocal'?'вокал':'удар'} ${g.min}+`:`+${fmt(p)} ₽`,dis:()=>locked,go(){
        const e={money:p,fun:-8};for(const k in g.fx||{})e[k]=(e[k]||0)+g.fx[k];scene('work',{cap:`Милана работает: ${g.t.toLowerCase()}`},1.9,()=>{say(g.note,'работа','',fx(e));qp('work')})}}}),'Подработка')},

function blackout(){
  const near=ORDER.filter(k=>k!==S.city&&dist(S.city,k)<=1100);
  const opts=[
    ()=>{S.tattoos++;say('Провал в памяти. Утром на плече новое тату. Похоже на дельфина. Или на кабачок.','провал','bad',fx({money:-Math.min(S.money,2500),hp:-5,content:1}))},
    ()=>say('Кто-то снял, как Милана танцует на барной стойке. Видео разлетелось по пабликам.','провал','big',fx({fame:rnd(30,70)*100,content:2})),
    ()=>{const p=Math.min(S.money,3500);say(`Угостила шотами весь бар. Бар её любит, кошелёк нет.`,'провал','bad',fx({money:-p,fame:500}))},
    ()=>fight(enemy('Вышибала Гена'),'Вышибала решил, что ей хватит. Милана решила, что нет.'),
  ];
  if(near.length)opts.push(()=>{const to=pick(near),km=dist(S.city,to);S.city=to;S.visited[to]=1;S.km+=km;S.hour+=6;
    say(`Провал в памяти. Очнулась в поезде и вышла в незнакомом городе. Это ${CITIES[to].name}. Как сюда попала, не помнит никто.`,'провал','big',fx({energy:-25,hp:-6,content:2}))});
  pick(opts)();
}

    {t:'Вписка у знакомых',m:S.fame>=1500?'бесплатно, как повезёт':'нужно 1 500 подписчиков',dis:()=>S.fame<1500,go(){scene('sleep',{bed:'vpiska',cap:'Милана на вписке'},2.6,()=>{const v=pick(VPISKA);say(v[0],'вписка',v[1],fx(v[2]));newDay({hp:5})})}},

function newDay(o){
  const h=S.booze;S.day++;S.booze=0;newQuest();S.hour=9+Math.min(h,4)+rnd(0,1);
  S.energy=Math.min(o.cap||100,100-h*10);
  const ch=fx({hp:(o.hp||0)-h*3,fun:-6});
  if(S.day>MAX_DAY)return ending('time');
  let t=`Утро. День ${S.day}. `+(h>=4?'Голова как колокол, во рту пустыня. Тяжёлое похмелье.':h>=2?'Лёгкое похмелье, но жить можно.':'Проснулась бодрой.');
  if(S.fun<20){t+=' На душе тоска, ничего не хочется.';S.energy=clamp(S.energy-10)}
  if(S.day===MAX_DAY)t+=' Последний день тура!';
  say(t,'утро',h>=4?'bad':'',ch);
  if(S.hp<=0)return ending('hp');
}

function ending(kind){S.over=true;S.endKind=kind;save();render();showEnding()}
function showEnding(){
  const v=Object.keys(S.visited).length;let rank,desc;
  if(S.endKind==='hp'){rank='Тур окончен досрочно';desc='Милану увезла скорая. Врачи сказали «отдыхать», мама сказала «домой». Через неделю она уже снова строила маршрут.'}
  else if(S.fame>=100000){rank='Звезда интернета';desc='Сто тысяч человек следили, как Милана живёт на полную. Лейблы пишут в директ.'}
  else if(v>=7){rank='Легенда трассы';desc='Объехала страну от Балтики до Тихого океана. Проводницы узнают её в лицо.'}
  else if(S.wins>=8){rank='Гроза районов';desc='В каждом городе теперь есть кто-то, кто вздрагивает от её имени.'}
  else if(S.songs>=10){rank='Королева караоке';desc='Микрофоны всех баров страны помнят её голос.'}
  else if(S.money>=50000){rank='Тусовщица с бизнес-жилкой';desc='Кайфовала и ещё заработала. Редкий талант.'}
  else if(S.drinks>=35){rank='Чемпионка барной стойки';desc='Бармены разных городов передают привет.'}
  else{rank='Просто кайфовала';desc='Тридцать дней свободы, сотня историй и ни одного скучного вечера.'}
  const kv=[['Дней в туре',Math.min(S.day,MAX_DAY)],['Городов',`${v} из 8`],['Километров',fmt(S.km)],['Подписчиков',fmt(S.fame)],['Драк выиграно',`${S.wins} из ${S.fights}`],['Песен спето',S.songs],['Походов в бар',S.drinks],['Татуировок',S.tattoos],['Денег осталось',fmt(S.money)+' ₽'],['Ачивок',`${Object.keys(S.ach||{}).length} из ${ACH.length}`],['Заданий дня',S.qDone||0]];
  openSheet(`<div class="kicker">Итоги тура</div><div class="ticket"><div class="rank">${rank}</div><p>${desc}</p><div class="dash" aria-hidden="true"></div><div class="kv">${kv.map(r=>`<span>${r[0]}</span><b>${r[1]}</b>`).join('')}</div></div><button type="button" class="big-btn" id="againBtn">Новый тур</button><button type="button" class="ghost" id="shareBtn">Поделиться результатом</button>`);
  $('againBtn').onclick=()=>{closeSheet();reset()};$('shareBtn').onclick=tgShare;
}

function srand(seed){let s=seed%2147483647||1;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function shade(hex,k){const n=parseInt(hex.slice(1),16);return`rgb(${Math.round((n>>16)*k)},${Math.round((n>>8&255)*k)},${Math.round((n&255)*k)})`}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill()}
function poly(c,pts){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fill()}
function skyAt(h){h=((h%24)+24)%24;
  if(h>=6&&h<9)return{top:'#5d6aa8',bot:'#f2a07c',far:'#6b6b9a',mid:'#4a4c78',night:false,sun:'#ffb27a',sunY:.55};
  if(h>=9&&h<17)return{top:'#5f9fdc',bot:'#cfe3f2',far:'#93a6c2',mid:'#6f84a6',night:false,sun:'#ffe48a',sunY:.2};
  if(h>=17&&h<20.5)return{top:'#38386f',bot:'#ec8659',far:'#57466e',mid:'#3c3156',night:false,sun:'#ff9a5a',sunY:.62};
  return{top:'#0a1130',bot:'#24325c',far:'#1b2546',mid:'#141b33',night:true};
}

// figure: P = pose, L = look. angles from straight-down, positive = towards facing side
function person(c,x,gy,s,P,L){
  const f=P.f||1;c.save();c.translate(x,gy-(P.bob||0));
  c.rotate(P.lie?-Math.PI/2*f*P.lie:(P.lean||0)*f);
  const hipY=-34*s,shY=-58*s,hY=-68*s,LL=33*s,AL=23*s;
  const seg=(x0,y0,a,len,w,col)=>{const x1=x0+Math.sin(a)*len*f,y1=y0+Math.cos(a)*len;c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();return[x1,y1]};
  const shoe=p=>{c.fillStyle=L.shoe;c.beginPath();c.ellipse(p[0]+2.5*f*s,p[1],5*s,3*s,0,0,7);c.fill()};
  const skin=P.hurt?'#f0908a':L.skin;
  if(L.hair==='long'){c.fillStyle=L.hairC;c.beginPath();c.ellipse(-2.5*f*s,hY+9*s,8*s,15*s,0,0,7);c.fill()}
  shoe(seg(-1.5*f*s,hipY,P.lr||0,LL,7*s,shade(L.pants,.75)));
  seg(-1*f*s,shY+3*s,P.ar||0,AL,5*s,shade(skin.startsWith('#')?skin:'#f0c6a2',.85));
  c.fillStyle=skin;c.fillRect(-6*s,shY+10*s,12*s,hipY-shY-10*s);
  c.fillStyle=L.top;rr(c,-7.5*s,shY,15*s,L.crop?13*s:(hipY-shY+2*s),4*s);
  c.fillStyle=L.pants;rr(c,-7*s,hipY-5*s,14*s,8*s,2*s);
  const fl=seg(1.5*f*s,hipY,P.ll||0,LL,7*s,L.pants);
  if(L.stripes){c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1.2*s;c.beginPath();c.moveTo(1.5*f*s,hipY);c.lineTo(fl[0],fl[1]-2*s);c.stroke()}
  shoe(fl);
  c.fillStyle=skin;c.fillRect(-2*s,hY+5*s,4*s,5*s);c.beginPath();c.arc(0,hY,7.5*s,0,7);c.fill();
  if(L.hair==='long'){c.fillStyle=L.hairC;c.beginPath();c.arc(0,hY-1*s,8*s,Math.PI,0);c.fill();c.fillRect(-8.5*f*s-(f<0?-0:0),hY-1*s,4*s*f,10*s)}
  else if(L.hair==='short'){c.fillStyle=L.hairC;c.beginPath();c.arc(0,hY-1.5*s,7.8*s,Math.PI,0);c.fill()}
  else if(L.hair==='cap'){c.fillStyle=L.cap||'#1d1f24';c.beginPath();c.arc(0,hY-1.5*s,8*s,Math.PI,0);c.fill();c.fillRect(0,hY-3*s,10*s*f,3*s)}
  if(P.ko){c.strokeStyle='#1a1410';c.lineWidth=1.2*s;const ex=3.2*f*s,ey=hY;c.beginPath();c.moveTo(ex-1.6*s,ey-1.6*s);c.lineTo(ex+1.6*s,ey+1.6*s);c.moveTo(ex+1.6*s,ey-1.6*s);c.lineTo(ex-1.6*s,ey+1.6*s);c.stroke()}
  else if(P.sleep){c.strokeStyle='#1a1410';c.lineWidth=1.1*s;c.beginPath();c.moveTo(2*f*s,hY+.5*s);c.lineTo(4.6*f*s,hY+.5*s);c.stroke()}
  else{c.fillStyle='#1a1410';c.beginPath();c.arc(3.2*f*s,hY+.5*s,1.15*s,0,7);c.fill()}
  if(P.blush){c.fillStyle='rgba(230,80,100,.6)';c.beginPath();c.arc(3*f*s,hY+3.6*s,1.9*s,0,7);c.fill()}
  if(P.mouth){c.fillStyle='#5a1f22';c.beginPath();c.ellipse(4.8*f*s,hY+4.2*s,1.4*s,Math.max(.4,P.mouth*2.2)*s,0,0,7);c.fill()}
  if(P.bandage){c.strokeStyle='#f4f1ea';c.lineWidth=2.2*s;c.beginPath();c.moveTo(-7*s,hY-2*s);c.lineTo(7*s,hY-4.5*s);c.stroke()}
  const hd=seg(1*f*s,shY+3*s,P.al||0,AL,5*s,skin);
  if(L.tat){c.fillStyle='rgba(30,30,40,.75)';const m=[(1*f*s+hd[0])/2,(shY+3*s+hd[1])/2];c.beginPath();c.arc(m[0],m[1],1.6*s,0,7);c.fill()}
  c.fillStyle=L.top;c.beginPath();c.arc(1*f*s,shY+3.5*s,3.4*s,0,7);c.fill();
  if(P.prop)prop(c,P.prop,hd[0],hd[1],s,f);
  c.restore();
}
function prop(c,k,x,y,s,f){
  c.save();c.translate(x,y);
  if(k==='mic'){c.rotate(-.5*f);c.fillStyle='#22252b';c.fillRect(-1.5*s,-1*s,3*s,9*s);c.fillStyle='#9aa3ae';c.beginPath();c.arc(0,-2.5*s,3.2*s,0,7);c.fill()}
  else if(k==='phone'){c.fillStyle='#15181d';rr(c,-3.2*s,-10*s,6.4*s,11*s,1.5*s);c.fillStyle='#8fd0ff';c.fillRect(-2.2*s,-9*s,4.4*s,8.4*s)}
  else if(k==='glass'){c.fillStyle='rgba(242,194,48,.9)';poly(c,[-5*s,-12*s,5*s,-12*s,0,-5*s]);c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=1.1;c.beginPath();c.moveTo(-6*s,-13*s);c.lineTo(6*s,-13*s);c.lineTo(0,-5*s);c.closePath();c.moveTo(0,-5*s);c.lineTo(0,1*s);c.moveTo(-3*s,1*s);c.lineTo(3*s,1*s);c.stroke()}
  else if(k==='roll'){c.rotate(-.9*f);c.fillStyle='#e9d3a6';rr(c,-3.2*s,-11*s,6.4*s,14*s,3*s);c.fillStyle='#c94a3a';c.fillRect(-2.6*s,-11*s,5.2*s,2.4*s);c.fillStyle='#4d8a3a';c.fillRect(-2.6*s,-8.6*s,5.2*s,1.4*s)}
  else if(k==='box'){c.fillStyle='#b58a52';c.fillRect(-7*s,-12*s,14*s,11*s);c.fillStyle='#8a6638';c.fillRect(-7*s,-8*s,14*s,2*s)}
  c.restore();
}

// ---------- stage: core ----------
class Stage{
  constructor(cv,kind){this.cv=cv;this.c=cv.getContext('2d');this.kind=kind||'main';this.parts=[];this.anim=null;this.t=0;this.dt=0;this.scroll=0;this.shake=0;this.flash=0;this.last=0;this.tiles={};
    const r=srand(7);this.stars=Array.from({length:40},()=>[r(),r()*.6,r()*6]);
    this.fit();try{this.ro=new ResizeObserver(()=>this.fit());this.ro.observe(cv)}catch(e){}
    this.loop=this.loop.bind(this);requestAnimationFrame(this.loop)}
  fit(){const r=this.cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);this.w=Math.max(10,r.width);this.h=Math.max(10,r.height);
    this.cv.width=Math.round(this.w*d);this.cv.height=Math.round(this.h*d);this.c.setTransform(d,0,0,d,0,0)}
  play(name,o,dur,cb){this.anim={name,o:o||{},t:0,dur:RM?Math.min(dur,.45):dur,cb,k:{}}}
  once(key){const a=this.anim;if(!a||a.k[key])return false;a.k[key]=1;return true}
  every(key,per){const a=this.anim;if(!a)return false;const n=Math.floor(a.t/per);if(a.k[key]===n)return false;a.k[key]=n;return true}
  loop(ts){if(!this.cv.isConnected){if(this.ro)this.ro.disconnect();return}
    this.dt=Math.min(.05,this.last?(ts-this.last)/1000:0);this.last=ts;this.t+=this.dt;
    if(this.anim){this.anim.t+=this.dt;if(this.anim.t>=this.anim.dur){const cb=this.anim.cb;this.anim=null;if(cb)cb()}}
    const c=this.c;c.save();c.clearRect(0,0,this.w,this.h);
    if(this.shake>0&&!RM){c.translate((Math.random()-.5)*this.shake,(Math.random()-.5)*this.shake);this.shake*=.86;if(this.shake<.4)this.shake=0}
    try{this.kind==='fight'?this.drawFight():this.kind==='karaoke'?this.drawKaraoke():this.drawMain()}catch(e){console.error(e)}
    this.drawParts();
    if(this.flash>0){c.fillStyle=`rgba(255,255,255,${this.flash})`;c.fillRect(-10,-10,this.w+20,this.h+20);this.flash=Math.max(0,this.flash-this.dt*2.6)}
    c.restore();requestAnimationFrame(this.loop)}
  spawn(o){this.parts.push(Object.assign({x:0,y:0,vx:0,vy:-30,g:0,life:1.4,age:0,size:14,col:'#ece6d6',txt:'',type:'txt',rot:0,vr:0,delay:0,font:FONT_D,w:700},o))}
  drawParts(){const c=this.c,dt=this.dt;
    this.parts=this.parts.filter(p=>{p.age+=dt;if(p.age<p.delay)return true;const a=p.age-p.delay;if(a>p.life)return false;
      p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;const al=Math.min(1,(p.life-a)/(p.life*.35));
      c.save();c.globalAlpha=Math.max(0,al);c.translate(p.x,p.y);c.rotate(p.rot);
      if(p.type==='conf'){c.fillStyle=p.col;c.fillRect(-2,-3.5,4,7)}
      else if(p.type==='burst'){const k=Math.min(1,a*9),r=p.size*1.25*k;c.fillStyle=p.col;c.beginPath();for(let i=0;i<20;i++){const rad=i%2?r*.62:r,ang=i/20*Math.PI*2;c.lineTo(Math.cos(ang)*rad*1.35,Math.sin(ang)*rad)}c.closePath();c.fill();c.strokeStyle='#14171c';c.lineWidth=2;c.stroke();
        c.fillStyle='#14171c';c.font=`700 ${Math.round(p.size*.62*k)+1}px ${FONT_D}`;c.textAlign='center';c.textBaseline='middle';c.fillText(p.txt,0,1)}
      else{c.font=`${p.w} ${p.size}px ${p.font}`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.strokeStyle='rgba(12,14,18,.85)';c.lineWidth=3;c.strokeText(p.txt,0,0);c.fillStyle=p.col;c.fillText(p.txt,0,0)}
      c.restore();return true})}
  chips(list,x,y){list.slice(0,6).forEach((ch,i)=>this.spawn({txt:ch.t,x:x+(i%2?22:-22),y:y-Math.floor(i/2)*15,vy:-24,life:2.1,delay:i*.14,size:12,font:FONT_M,w:600,col:ch.c==='up'?'#9fe0b6':ch.c==='dn'?'#f3a9a8':'#ece6d6'}))}
  confetti(n){const cols=['#f2c230','#e8457c','#2b8b53','#8fd0ff','#ece6d6'];for(let i=0;i<n;i++)this.spawn({type:'conf',x:Math.random()*this.w,y:-10-Math.random()*40,vx:(Math.random()-.5)*60,vy:40+Math.random()*60,g:30,vr:(Math.random()-.5)*10,life:2.4,col:cols[i%cols.length]})}
  burst(txt,x,y,col,size){this.spawn({type:'burst',txt,x,y,vy:-8,life:.75,size:size||20,col:col||'#f2c230'})}
  float(txt,x,y,col,size,o){this.spawn(Object.assign({txt,x,y,col:col||'#ece6d6',size:size||16},o||{}))}
}
// ---------- stage: poses & scenes ----------
const sway=t=>S.booze>=3?Math.sin(t*1.7)*(.05+S.booze*.02):0;
const lookM=()=>Object.assign({},GIRL,{tat:S.tattoos>0});
const idleP=t=>({ll:.06,lr:-.06,al:.15+Math.sin(t*2)*.05,ar:-.12,bob:Math.sin(t*2)*.6,lean:sway(t),blush:S.booze>=2,bandage:S.hp<35});
const walkP=(t,sp)=>{const ph=t*(sp||7);return{ll:Math.sin(ph)*.55,lr:-Math.sin(ph)*.55,al:-Math.sin(ph)*.45,ar:Math.sin(ph)*.45,bob:Math.abs(Math.sin(ph))*2.5,lean:sway(t),blush:S.booze>=2,bandage:S.hp<35}};
const danceP=t=>{const ph=t*8;return{al:2.3+Math.sin(ph)*.45,ar:2.6+Math.cos(ph)*.4,ll:Math.sin(ph)*.25,lr:-Math.sin(ph)*.25,bob:Math.abs(Math.sin(ph))*4,lean:Math.sin(ph*.5)*(.08+S.booze*.03),blush:S.booze>=1,mouth:.5,prop:'glass'}};
function enemyLook(n){const h=[...n].reduce((a,ch)=>a+ch.charCodeAt(0),0);
  if(/девушк/i.test(n))return{hair:'long',hairC:'#c9a04a',skin:'#efc4a0',top:'#7a3fb0',pants:'#24262c',shoe:'#e8e2d6',crop:true};

  ask('Где петь?','Голос есть, настроение есть, осталось выбрать сцену.',[
    {t:`Караоке-бар · ${fmt(kc)} ₽`,m:'больше подписчиков и кайфа',dis:()=>S.money<kc,go(){S.money-=kc;karaoke('bar',kc)}},
    {t:`На улице ${STREET[S.city]}`,m:'бесплатно, прохожие кидают деньги',go(){karaoke('street')}}],'Петь');
}
function karaoke(venue,paid){
  const song=pick(SONGS),notes=[];let i=0,pos=0,dir=1,zone=0,raf=0,last=0,locked=true;
  const width=clamp(14+S.vocal*1.6+(S.booze>=1&&S.booze<=2?6:0)-(S.booze>=3?4:0),10,34),wob=S.booze>=3;
  openSheet(`<div class="kicker">${venue==='bar'?'Караоке-бар':'Уличный концерт'} · ${C().name}</div><h3>«${song.t}»</h3>
    <canvas class="mini-stage" id="kStage" aria-hidden="true"></canvas>
    <p class="muted">Жми, когда жёлтая линия в зелёной зоне. В центре зоны чище звук.${wob?' Градус высокий, линия пляшет.':S.booze>=1?' Пара бокалов добавила смелости: зона шире.':''}</p>
    <div class="lyric" id="kLyric"></div>
    <div class="track" id="kTrack"><div class="zone" id="kZone"><b></b></div><div class="needle" id="kNeedle"></div></div>
    <div class="notes" id="kNotes"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="verdict" id="kVerdict" aria-live="polite"></div>
    <button type="button" class="big-btn" id="kBtn">Попасть в ноту</button>`);
  const st=new Stage($('kStage'),'karaoke');st.karaokeInit(venue);
  function setNote(){if(!$('kZone'))return;zone=rnd(6,94-Math.round(width));
    $('kZone').style.left=zone+'%';$('kZone').style.width=width+'%';$('kLyric').textContent=song.l[i];
    pos=chance(.5)?0:100;dir=pos?-1:1;locked=false;$('kBtn').disabled=false;$('kVerdict').textContent=''}
  function tick(t){if(!$('kNeedle'))return;if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;
    if(!locked){let sp=(58+i*13)*(wob?1.3:1);if(wob)sp*=1+.55*Math.sin(t/170);
      pos+=dir*sp*dt;if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}$('kNeedle').style.left=pos+'%'}
    raf=requestAnimationFrame(tick)}
  function hit(){if(locked||!$('kBtn'))return;locked=true;$('kBtn').disabled=true;
    const off=Math.abs(pos-(zone+width/2));const s=off<=width*.15?2:off<=width/2?1:0;
    notes.push(s);$('kNotes').children[i].className='n'+s;$('kVerdict').textContent=s===2?'Чисто!':s===1?'Нормально':'Мимо нот';
    st.note(s);sfx('sing',s,i);i++;if(i<5)setTimeout(setNote,650);else{st.karaokeEnd(notes.reduce((a,b)=>a+b,0));setTimeout(finish,1500)}}
  function finish(){cancelAnimationFrame(raf);kHit=null;closeSheet();
    const sc=notes.reduce((a,b)=>a+b,0);S.songs++;
    const e={vocal:.4,content:sc>=7?2:1};let t;
    if(venue==='bar'){e.fame=Math.round(sc*rnd(90,150)*(1+S.vocal/8)/10)*10;e.fun=sc*2+5;
      t=sc>=8?`Спела «${song.t}» так, что весь зал снимал на телефоны.`:sc>=5?`«${song.t}» прозвучала уверенно, пара столиков подпевала.`:`«${song.t}» вышла мимо нот, но с душой. Зал смеялся вместе с ней.`}
    else{e.money=Math.round(sc*C().pay*rnd(70,140)/10)*10;e.fame=sc*rnd(20,50);e.fun=sc+4;
      t=sc>=8?`Собрала толпу ${STREET[S.city]}. В шляпу летели купюры.`:sc>=5?`Пела ${STREET[S.city]}, прохожие притормаживали и кидали мелочь.`:`Пела ${STREET[S.city]}. Голуби остались, люди нет.`}
    say(t+` Счёт ${sc} из 10.`,venue==='bar'?'караоке':'улица',sc>=8?'big':sc>=5?'good':'',(paid?[{t:`−${fmt(paid)} ₽`,c:'dn'}]:[]).concat(fx(e)));
    if(sc>=7)qp('sing');
    if(sc>=9&&chance(.35))say('После выступления подошёл продюсер и взял номер. Подписчики пишут «когда альбом».','продюсер','big',fx({fame:3000,fun:10}));
    done()}
  $('kBtn').onclick=hit;$('kTrack').onpointerdown=hit;kHit=hit;
  setTimeout(setNote,400);raf=requestAnimationFrame(tick);
}

// ---------- fight ----------
function fight(en,intro){
  S.fights++;const maxE=en.hp,hp0=S.hp;let eh=en.hp,next='atk',tell='',ended=false,lock=false;
  const pd=()=>Math.round(7+S.punch*1.3+S.booze*1.5),scale=.92+Math.max(0,en.hp-24)/22*.2;
  function plan(){const r=Math.random(),a=en.ai;next=r<a[0]?'atk':r<a[0]+a[1]?'blk':'dge';tell=pick(TELLS[chance(.7)?next:pick(['atk','blk','dge'])])}
  openSheet(`<div class="kicker">Драка · ${C().name}</div><h3>${en.n}</h3><canvas class="mini-stage" id="fStage" aria-hidden="true"></canvas><div class="fbody" id="fBody"></div>`);
  const st=new Stage($('fStage'),'fight');st.fightInit(enemyLook(en.n),scale);
  const bars=()=>`<div class="fighters"><div class="ftr"><div class="g-l">Милана<b>${S.hp}</b></div><div class="bar"><i style="width:${S.hp}%;--c:var(--siren)"></i></div></div>
    <div class="ftr"><div class="g-l">Противник<b>${eh}</b></div><div class="bar"><i style="width:${eh/maxE*100}%;--c:var(--muted)"></i></div></div></div>`;
  function draw(msg,endHtml){
    $('fBody').innerHTML=bars()+(endHtml||`<div class="tell">Противник ${tell}</div>
      <div class="flog" aria-live="polite">${msg}</div>
      <div class="moves">
        <button type="button" class="choice" data-m="atk"><span class="act-t">Ударить</span><span class="act-m">урон ~${pd()}</span></button>
        <button type="button" class="choice" data-m="blk"><span class="act-t">Блок</span><span class="act-m">гасит 70%</span></button>
        <button type="button" class="choice" data-m="dge"><span class="act-t">Уклон</span><span class="act-m">встречный ×1,4</span></button>
      </div><button type="button" class="ghost" data-m="run">Свалить дворами</button>`);
    $('fBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(b.dataset.m));
  }
  function move(p){if(ended||lock)return;
    if(p==='run')return end('run');
    const E=en.d*(.8+Math.random()*.4),P=pd(),e=next;let dE=0,dP=0,m;
    if(p==='atk'){if(e==='atk'){dE=P;dP=E;m='Обмен ударами! Обоим прилетело.'}else if(e==='blk'){dE=P*.35;m='Закрылся, удар прошёл вскользь.'}else{dP=E*.5;m='Промах! Увернулся и ткнул в ответ.'}}
    else if(p==='blk'){if(e==='atk'){dP=E*.3;m='Блок! Удар почти не прошёл.'}else{m='Стоят, смотрят друг на друга. Милана отдышалась.'}}
    else{if(chance(S.booze*.08)){dP=E;m='Хотела увернуться, но градус повёл в сторону. Прилетело.'}else if(e==='atk'){dE=P*1.4;m='Нырок под руку и встречный! Красота.'}else{m='Обе стороны пританцовывают. Ничья в раунде.'}}
    eh=Math.max(0,eh-Math.round(dE));S.hp=clamp(S.hp-Math.round(dP));
    lock=true;$('fBody').querySelectorAll('button').forEach(b=>b.disabled=true);
    st.fightAct(p,e,dP>=1,dE>=1);
    setTimeout(()=>{lock=false;if(!$('fBody'))return;if(eh<=0)return end('win');if(S.hp<=10)return end('lose');plan();draw(m)},RM?150:640);
  }
  function end(r){ended=true;st.fightEnd(r);const lost=hp0-S.hp,hpChip=lost>0?[{t:`−${lost} здоровья`,c:'dn'}]:[];let t,kind,ch;
    if(r==='win'){S.wins++;qp('win');ch=fx({fame:Math.round((150+maxE*12)*rnd(8,14)/100)*10,fun:15,content:2,punch:.5});t=`${en.n} лежит и просит не снимать. Поздно, уже сняли.`;kind='big';st.confetti(30)}
    else if(r==='lose'){ch=fx({fun:-10,punch:.3});t=`${en.n} оказался сильнее. Друзья утащили Милану подальше.`;kind='bad'}
    else{ch=fx({fun:-5});t='Милана решила, что оно того не стоит, и ушла дворами.';kind=''}
    say(t,'драка',kind,hpChip.concat(ch));
    let police='';
    if(r!=='run'&&chance(.22)){const p=Math.min(S.money,1000);police=`Приехал наряд. Протокол по статье 20.1 КоАП, мелкое хулиганство, штраф ${fmt(p)} ₽.`;say(police,'полиция','bad',fx({money:-p,fun:-5}))}
    draw('',`<div class="tell">${r==='win'?'Победа.':r==='lose'?'Поражение.':'Ушла без боя.'} ${t}</div>${police?`<p class="muted">${police}</p>`:''}<button type="button" class="big-btn" id="fDone">Дальше</button>`);
    $('fDone').onclick=()=>{closeSheet();done()};$('fDone').focus({preventScroll:true});
  }
  plan();draw(`${intro?intro+' ':''}Подсказка о замысле противника верна примерно в 7 случаях из 10.`);
  const f=$('fBody').querySelector('.choice');if(f)f.focus({preventScroll:true});
}

// ---------- travel ----------
const dn=n=>{const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'день':a>=2&&a<=4&&(b<12||b>14)?'дня':'дней')};
function travelMenu(){
  let sel=ORDER.find(k=>k!==S.city&&!S.visited[k])||ORDER.find(k=>k!==S.city);
  function draw(){
    const km=dist(S.city,sel),to=CITIES[sel],left=MAX_DAY-S.day;
    const pPlane=Math.round((3500+km*2.6)/100)*100,pTrain=Math.max(900,Math.round(km*2.1/100)*100);
    const dTrain=Math.max(1,Math.ceil(km/1300)),dHitch=Math.max(1,Math.ceil(km/800));
    const noCar=sel==='kgd'||S.city==='kgd';
    const warn=d=>d>left?' · тур закончится в дороге':'';
    const modes=[
      {id:'plane',t:`Самолёт · ${fmt(pPlane)} ₽`,m:'прилёт сегодня, −25 сил',dis:S.money<pPlane,price:pPlane,days:0},
      {id:'train',t:`Плацкарт · ${fmt(pTrain)} ₽`,m:`${dn(dTrain)} в пути, отоспится в вагоне${warn(dTrain)}`,dis:S.money<pTrain,price:pTrain,days:dTrain},
      {id:'hitch',t:'Автостоп · бесплатно',m:noCar?'через Литву без визы не пустят':`${dn(dHitch)} на трассе${warn(dHitch)}`,dis:noCar,price:0,days:dHitch},
    ];
    $('sheet').innerHTML=`<div class="kicker">Куда дальше · ${fmt(S.money)} ₽ на карте</div>
      <div class="strip" role="group" aria-label="Города">${ORDER.map(k=>`<button type="button" class="stop${k===S.city?' here':S.visited[k]?' been':''}${k===sel?' sel':''}" data-k="${k}" ${k===S.city?'disabled':''} aria-label="${CITIES[k].name}"><span class="dot"></span><span>${CITIES[k].short}</span></button>`).join('')}</div>
      <div class="legend"><span><i class="l-here"></i>здесь</span><span><i class="l-been"></i>уже была</span><span><i></i>ещё нет</span></div>
      <h3>${C().short} → ${to.name}</h3><p class="muted">${fmt(km)} км по дорогам · ${to.sub}</p>
      <div class="choices">${modes.map(o=>`<button type="button" class="choice" data-g="${o.id}" ${o.dis?'disabled':''}><span class="act-t">${o.t}</span><span class="act-m">${o.m}</span></button>`).join('')}
      <button type="button" class="choice" data-g="stay"><span class="act-t">Остаться</span><span class="act-m">тут ещё не всё</span></button></div>`;
    $('sheet').querySelectorAll('.stop').forEach(b=>b.onclick=()=>{sel=b.dataset.k;draw()});
    $('sheet').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=b.dataset.g;if(g==='stay'){closeSheet();return done()}const o=modes.find(x=>x.id===g);go(o,km)});
  }
  function go(o,km){closeSheet();const dest=sel,to=CITIES[dest];
    const cap=o.id==='plane'?`Милана летит: ${to.name}`:o.id==='train'?`Плацкарт до города ${to.name}`:'Милана ловит попутку';
    scene(o.id,{cap},o.id==='plane'?2.4:2.7,()=>arrive(o,km,dest))}
  function arrive(o,km,dest){const to=CITIES[dest],first=!S.visited[dest],ev=pick(ROAD[o.id]);
    S.money-=o.price;S.km+=km;
    const lbl={plane:'Самолёт',train:'Плацкарт',hitch:'Автостоп'}[o.id];
    const chips=(o.price?[{t:`−${fmt(o.price)} ₽`,c:'dn'}]:[]).concat(fx(ev[2]));
    say(`${lbl} до города ${to.name}, ${fmt(km)} км. ${ev[0]}`,o.id==='plane'?'перелёт':o.id==='train'?'поезд':'трасса',ev[1],chips);
    S.city=dest;S.visited[dest]=1;qp('travel');
    if(o.id==='plane'){S.hour+=Math.max(3,Math.round(km/900)+2);S.energy=clamp(S.energy-25)}
    else{S.day+=o.days;S.booze=0;S.hour=9+rnd(0,2);S.energy=o.id==='train'?95:80;
      const c2=fx({hp:o.id==='train'?4*o.days:-2*o.days,fun:-3*o.days});
      if(S.day>MAX_DAY){S.day=MAX_DAY+1;say('Тур закончился прямо в дороге.','финиш','',c2);return ending('time')}
      newQuest();if(c2.length)say(`Утро. День ${S.day}. Дорога позади.`,'утро','',c2)}
    if(first)say(`${to.name}! Здесь Милана впервые. Новые улицы, новый контент.`,'новый город','big',fx({content:2,fun:10}));
    else say(`Снова ${to.name}. Тут её уже помнят.`,'город','',fx({fun:4}));
    if(STAGE)STAGE.flash=.5}
  openSheet('');draw();
  const f=$('sheet').querySelector('.choice:not(:disabled)');if(f)f.focus({preventScroll:true});
}

// ---------- boot ----------
$('actions').addEventListener('click',e=>{const b=e.target.closest('.act');if(b&&!b.disabled&&!S.over&&$('modal').hidden)doAction(b.dataset.a)});
$('newGame').onclick=()=>{if(busy)return;if(S.over){closeSheet();return reset()}
  ask('Начать новый тур?','Текущий прогресс Миланы пропадёт: дни, деньги, подписчики.',[
    {t:'Да, заново',m:'день 1, Москва, 5 000 ₽',go(){reset()}},
    {t:'Нет, продолжить',m:'вернуться в игру',go(){}}],'Новый тур')};
document.addEventListener('keydown',e=>{if(kHit&&(e.code==='Space'||e.key===' ')){e.preventDefault();kHit()}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))sfx('click')});
$('sndBtn').onclick=()=>{SND.on=!SND.on;sndSave();sndUI();sfx('good')};
$('voiceBtn').onclick=()=>{SND.voice=!SND.voice;sndSave();sndUI();if(SND.voice)speak('Голос включён. Погнали!');else try{speechSynthesis.cancel()}catch(e){}};
$('achBtn').onclick=achMenu;
if(HAS_TTS)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
function start(data){if(!STAGE)STAGE=new Stage($('stageCv'),'main');S=(data&&data.S)||load()||null;if(!S){S=fresh();intro()}
  if(!S.ach)S.ach={};if(!S.q)newQuest();sndUI();render();save();if(S.over)showEnding()}
// В Telegram сначала пробуем облачное сохранение: оно живёт в аккаунте и не теряется при смене телефона.
if(TG&&!load())cloudLoad(s=>start({S:s}));else start({});
</script>
</body>
